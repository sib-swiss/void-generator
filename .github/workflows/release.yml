# Cuts a release: bumps the pom to a release version, tags it (v<version>,
# matching every tag since v0.4), deploys the signed artifacts to Maven
# Central, then bumps the pom to the next -SNAPSHOT and pushes both commits
# and the tag back to the repository. This is what `mvn release:prepare
# release:perform` already does locally -- this workflow just runs that
# same, already-established process in CI instead. It also creates a
# GitHub release for the new tag with the runnable uber jar attached
# (central-publishing-maven-plugin only ever handles the Central side --
# the plain/sources/javadoc jars, not the shaded one -- so this is the
# only place the uber jar actually gets published anywhere).
#
# Manually triggered only (workflow_dispatch): a release is a one-way,
# externally-visible action (a Maven Central publish can't be unpublished),
# so this is deliberately never run on a push/PR trigger. Use the dry-run
# input to rehearse the prepare step (version bumps, tag name) without
# committing, tagging, pushing, deploying, or creating a release.
#
# Needs these repository secrets to actually do anything:
#   GPG_PRIVATE_KEY   - ASCII-armored private key (`gpg --export-secret-keys --armor <keyname>`)
#   GPG_KEYNAME        - the key's id/fingerprint (matches pom.xml's ${gpg.keyname})
#   GPG_PASSPHRASE     - passphrase for that key
#   CENTRAL_USERNAME   - Maven Central Portal user token username
#   CENTRAL_PASSWORD   - Maven Central Portal user token password
# Without them configured, this workflow exists but cannot succeed past the
# point a credential is actually needed -- it is safe to merge in before
# those secrets are added to the repository. The GitHub release step only
# needs the automatic GITHUB_TOKEN (nothing to configure for that one), via
# the contents: write permission already granted below.

name: Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run: rehearse release:prepare (version bumps, tag name) without committing, tagging, pushing or deploying"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    # workflow_dispatch lets whoever runs it pick any branch; releases should
    # only ever come from main.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure git identity for the release commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # actions/checkout leaves the repo on a detached HEAD, which
          # maven-release-plugin cannot commit/push from -- reattach to the
          # branch that was actually checked out.
          git checkout -B "${{ github.ref_name }}"

      - name: Import GPG signing key
        if: ${{ !inputs.dryRun }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --yes --import

      - name: Write Maven settings.xml for signing and Central Publishing
        if: ${{ !inputs.dryRun }}
        env:
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>${GPG_KEYNAME}</id>
                <passphrase>${GPG_PASSPHRASE}</passphrase>
              </server>
              <server>
                <id>central</id>
                <username>${CENTRAL_USERNAME}</username>
                <password>${CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Dry-run release:prepare (no commit, tag, push or deploy)
        if: ${{ inputs.dryRun }}
        run: mvn -B release:prepare -DdryRun=true

      - name: release:prepare
        if: ${{ !inputs.dryRun }}
        run: mvn -B release:prepare

      - name: Capture the prepared release tag and version
        if: ${{ !inputs.dryRun }}
        id: prepared
        run: |
          # Read this right after release:prepare, not after release:perform:
          # on success, release:perform cleans up release.properties (and,
          # unless told not to below, target/checkout) automatically, since
          # they're meant to be transient prepare/perform working files --
          # by the time a later step looked for it, it was already gone.
          tag=$(grep '^scm.tag=' release.properties | cut -d= -f2)
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: release:perform
        if: ${{ !inputs.dryRun }}
        env:
          GPG_KEYNAME: ${{ secrets.GPG_KEYNAME }}
        run: |
          # -DcleanCheckout=false: keep target/checkout (and the uber jar
          # built inside it) around afterward instead of deleting it on
          # success, the same reason release.properties is read above and
          # not here.
          mvn -B release:perform -DcleanCheckout=false -Darguments="-Dgpg.keyname=${GPG_KEYNAME}"

      - name: Create GitHub release with the uber jar attached
        if: ${{ !inputs.dryRun }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar="target/checkout/target/void-generator-${{ steps.prepared.outputs.version }}-uber.jar"
          test -f "$jar"
          gh release create "${{ steps.prepared.outputs.tag }}" \
            "$jar" \
            --title "${{ steps.prepared.outputs.tag }}" \
            --generate-notes
